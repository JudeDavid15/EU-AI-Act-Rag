services:
  api:
      build:
        context: .
        dockerfile: Dockerfile.api
      container_name: rag_fastapi_backend
      ports:
        - "8000:8000"
      volumes:
        - huggingface_cache:/root/.cache/huggingface
        - ./data:/app/data
        - ./indices:/app/indices
      environment:
        - PYTHONUNBUFFERED=1
        - OLLAMA_HOST=http://host.docker.internal:11434
        - CACHE_ENABLED=true
        - REDIS_URL=redis://valkey:6379/0
        - CACHE_TTL_SECONDS=3600
        - RAG_CACHE_VERSION=eu-ai-act-rag-v1
      depends_on:
        valkey:
          condition: service_healthy
      extra_hosts:
        - "host.docker.internal:host-gateway"
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: rag_streamlit_ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
  valkey:
    image: valkey/valkey:8-alpine
    container_name: rag_valkey_cache
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  huggingface_cache:
  valkey_data: